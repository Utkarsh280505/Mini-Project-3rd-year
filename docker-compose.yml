version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: neuroearly-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - ml-engine
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: neuroearly-frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  ml-engine:
    build:
      context: ./ml-engine
    container_name: neuroearly-ml-engine
    ports:
      - "5001:5001"
    restart: unless-stopped
